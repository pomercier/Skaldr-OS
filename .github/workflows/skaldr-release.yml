name: Publish validated Skaldr OS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Development preview tag, e.g. v0.1.0-preview.1'
        required: true
        type: string
      stable:
        description: 'Publish as stable (blocked until a separately validated release-mode ISO exists)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: skaldr-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact default-branch revision
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Validate version and revision
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_STABLE: ${{ inputs.stable }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_STABLE" == true ]]; then
            echo "::error::Stable publishing requires a release-mode ISO and physical testing. Only previews are permitted."
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-preview\.([1-9][0-9]*)$ ]]; then
            echo "::error::Use vMAJOR.MINOR.PATCH-preview.N, for example v0.1.0-preview.1"
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "$(cat VERSION)" ]]; then
            echo "::error::Preview base version does not match VERSION"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$RELEASE_VERSION" >/dev/null; then
            echo "::error::The release tag already exists."
            exit 1
          fi
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Require successful ISO build and installation tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow build.yml --commit "$RELEASE_SHA" \
            --status success --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -z "$run_id" ]]; then
            echo "::error::No fully successful Desktop ISO workflow exists for this exact source revision."
            exit 1
          fi
          echo "VERIFIED_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "Verified ISO run: $run_id"
          source_run="$(gh run list --workflow skaldr-checks.yml --commit "$RELEASE_SHA" \
            --status success --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -z "$source_run" ]]; then
            echo "::error::No successful source checks exist for this exact source revision."
            exit 1
          fi
          echo "Verified source checks: $source_run"

      - name: Retrieve verified ISO and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Raw GitHub Actions artifacts and packaged release files must live
          # in different directories: the packer refuses non-empty outputs.
          mkdir -p ci-artifacts
          # Download only the ISO artifact; the workflow also publishes
          # diagnostics and split/reassembly verification metadata.
          gh run download "$VERIFIED_RUN_ID" --pattern 'skaldr-os-x86_64-*' --dir ci-artifacts
          iso_count="$(find ci-artifacts -type f -name '*.iso' | wc -l)"
          [[ "$iso_count" -eq 1 ]] || {
            echo "::error::Expected exactly one ISO in the successful run, got $iso_count."
            exit 1
          }
          iso="$(find ci-artifacts -type f -name '*.iso' -print -quit)"
          manifest="$(find ci-artifacts -type f -name SHA256SUMS -print -quit)"
          [[ -f "$manifest" ]] || {
            echo "::error::SHA256SUMS is missing."
            exit 1
          }
          (
            cd "$(dirname "$manifest")"
            sha256sum --check SHA256SUMS
          )
          # Each GitHub Release asset must be strictly smaller than 2 GiB.
          # Keep the full ISO SHA256SUMS and add hashes for each part.
          python3 scripts/skaldr-release-assets.py prepare \
            --iso "$iso" \
            --checksum "$manifest" \
            --out release-assets
          test -n "$(find release-assets -maxdepth 1 -name '*.iso.part*' -print -quit)"

      - name: Publish the authorized release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_STABLE: ${{ inputs.stable }}
        run: |
          set -euo pipefail
          notes="This is a DEVELOPMENT PREVIEW from tested commit $RELEASE_SHA, not a hardware-certified stable release. Download all ISO parts, both SHA256 manifests, ASSEMBLE.txt and reassemble-skaldr-iso.py. Run the script to verify each part and reassemble the original ISO before flashing it."
          gh release create "$RELEASE_VERSION" release-assets/* \
            --target "$RELEASE_SHA" \
            --title "Skaldr OS $RELEASE_VERSION" \
            --generate-notes --notes "$notes" \
            --prerelease --latest=false
