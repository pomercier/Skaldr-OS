name: Publish validated Skaldr OS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Development preview tag, e.g. v0.1.0-preview.1'
        required: true
        type: string
      stable:
        description: 'Publish as stable (blocked until a separately validated release-mode ISO exists)'
        required: true
        default: false
        type: boolean
      source_sha:
        description: 'Optional exact 40-character commit SHA of a fully validated ISO; defaults to master HEAD'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: skaldr-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact default-branch revision
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Validate version and revision
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_STABLE: ${{ inputs.stable }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_STABLE" == true ]]; then
            echo "::error::Stable publishing requires a release-mode ISO and physical testing. Only previews are permitted."
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-preview\.([1-9][0-9]*)$ ]]; then
            echo "::error::Use vMAJOR.MINOR.PATCH-preview.N, for example v0.1.0-preview.1"
            exit 1
          fi
          release_base="${BASH_REMATCH[1]}"
          # A documentation-only master commit can follow a validated ISO.
          # Require an exact SHA and strict ancestry, never use an untested
          # branch name or arbitrary revision to select release assets.
          candidate="${REQUESTED_SOURCE_SHA:-$(git rev-parse HEAD)}"
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]] ||
             ! git cat-file -e "$candidate^{commit}" ||
             ! git merge-base --is-ancestor "$candidate" HEAD; then
            echo "::error::source_sha must be a 40-character commit SHA reachable from master."
            exit 1
          fi
          if [[ "$release_base" != "$(git show "$candidate:VERSION")" ]]; then
            echo "::error::Preview base version does not match VERSION at the tested source SHA."
            exit 1
          fi
          # Preview.2 is intentionally pinned to the EXACT five-job ISO
          # revision. Reject accidental publication from a docs-only newer
          # master HEAD or another unverified ISO, before creating a tag.
          if [[ "$RELEASE_VERSION" == "v0.1.0-preview.2" ]]; then
            pinned_sha="$(python3 -c 'import json; print(json.load(open("docs/PUBLIC-PREVIEW-2-LOCK.json"))["source_sha"])')"
            if [[ "$candidate" != "$pinned_sha" ]]; then
              echo "::error::Preview.2 must use its exact pinned, five-job validated source SHA $pinned_sha."
              exit 1
            fi
          fi
          if git rev-parse -q --verify "refs/tags/$RELEASE_VERSION" >/dev/null; then
            echo "::error::The release tag already exists."
            exit 1
          fi
          echo "RELEASE_SHA=$candidate" >> "$GITHUB_ENV"
          echo "Selected exact tested release revision: $candidate"

      - name: Require successful ISO build and installation tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow build.yml --commit "$RELEASE_SHA" \
            --status success --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -z "$run_id" ]]; then
            echo "::error::No fully successful Desktop ISO workflow exists for this exact source revision."
            exit 1
          fi
          echo "VERIFIED_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "Verified ISO run: $run_id"
          source_run="$(gh run list --workflow skaldr-checks.yml --commit "$RELEASE_SHA" \
            --status success --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -z "$source_run" ]]; then
            echo "::error::No successful source checks exist for this exact source revision."
            exit 1
          fi
          echo "Verified source checks: $source_run"

      - name: Preserve trusted preview.2 lock and prepublication verifier
        if: ${{ inputs.version == 'v0.1.0-preview.2' }}
        shell: bash
        run: |
          set -euo pipefail
          # The validated ISO is from an older, immutable source SHA. Save the
          # current source-independent release gate BEFORE checking that SHA out.
          mkdir -p "${RUNNER_TEMP}/skaldr-release-gate"
          cp -- docs/PUBLIC-PREVIEW-2-LOCK.json \
            "${RUNNER_TEMP}/skaldr-release-gate/PUBLIC-PREVIEW-2-LOCK.json"
          cp -- scripts/skaldr-verify-public-release.py \
            "${RUNNER_TEMP}/skaldr-release-gate/skaldr-verify-public-release.py"

      - name: Checkout the exact source tree that produced the validated ISO
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Retrieve verified ISO and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Raw GitHub Actions artifacts and packaged release files must live
          # in different directories: the packer refuses non-empty outputs.
          mkdir -p ci-artifacts
          # Download only the ISO artifact; the workflow also publishes
          # diagnostics and split/reassembly verification metadata.
          gh run download "$VERIFIED_RUN_ID" --pattern 'skaldr-os-x86_64-*' --dir ci-artifacts
          iso_count="$(find ci-artifacts -type f -name '*.iso' | wc -l)"
          [[ "$iso_count" -eq 1 ]] || {
            echo "::error::Expected exactly one ISO in the successful run, got $iso_count."
            exit 1
          }
          iso="$(find ci-artifacts -type f -name '*.iso' -print -quit)"
          manifest="$(find ci-artifacts -type f -name SHA256SUMS -print -quit)"
          [[ -f "$manifest" ]] || {
            echo "::error::SHA256SUMS is missing."
            exit 1
          }
          (
            cd "$(dirname "$manifest")"
            sha256sum --check SHA256SUMS
          )
          # Each GitHub Release asset must be strictly smaller than 2 GiB.
          # Keep the full ISO SHA256SUMS and add hashes for each part.
          python3 scripts/skaldr-release-assets.py prepare \
            --iso "$iso" \
            --checksum "$manifest" \
            --out release-assets
          test -n "$(find release-assets -maxdepth 1 -name '*.iso.part*' -print -quit)"

      - name: Verify pinned preview.2 checksums before public upload
        if: ${{ inputs.version == 'v0.1.0-preview.2' }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check SHA256SUMS.parts)
          python3 "${RUNNER_TEMP}/skaldr-release-gate/skaldr-verify-public-release.py" assets \
            --lock "${RUNNER_TEMP}/skaldr-release-gate/PUBLIC-PREVIEW-2-LOCK.json" \
            --directory release-assets

      - name: Publish the authorized release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_STABLE: ${{ inputs.stable }}
        run: |
          set -euo pipefail
          notes="This is a DEVELOPMENT PREVIEW from tested commit $RELEASE_SHA, not a hardware-certified stable release. Download all ISO parts, both SHA256 manifests, ASSEMBLE.txt and reassemble-skaldr-iso.py. Run the script to verify each part and reassemble the original ISO before flashing it."
          gh release create "$RELEASE_VERSION" release-assets/* \
            --target "$RELEASE_SHA" \
            --title "Skaldr OS $RELEASE_VERSION" \
            --generate-notes --notes "$notes" \
            --prerelease --latest=false

  independent_preview2_integrity:
    name: Independently reconstruct public preview.2 after release
    needs: release
    if: ${{ inputs.version == 'v0.1.0-preview.2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted repository verification code
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Verify exactly published preview.2 metadata
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/pomercier/Skaldr-OS/releases/tags/v0.1.0-preview.2 > "${RUNNER_TEMP}/preview2-release.json"
          python3 scripts/skaldr-verify-public-release.py metadata \
            --lock docs/PUBLIC-PREVIEW-2-LOCK.json \
            --metadata "${RUNNER_TEMP}/preview2-release.json"
      - name: Download all seven actual PUBLIC release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/public-preview2"
          gh release download v0.1.0-preview.2 \
            --repo pomercier/Skaldr-OS \
            --dir "${RUNNER_TEMP}/public-preview2"
      - name: Verify original CI hashes and reconstruct ISO on independent runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/ci
          python3 scripts/skaldr-verify-public-release.py verify \
            --lock docs/PUBLIC-PREVIEW-2-LOCK.json \
            --metadata "${RUNNER_TEMP}/preview2-release.json" \
            --directory "${RUNNER_TEMP}/public-preview2" \
            --report results/ci/preview2-public-integrity.json
          cat results/ci/preview2-public-integrity.json
      - name: Preserve small public release proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skaldr-published-preview2-integrity
          path: results/ci/preview2-public-integrity.json
          if-no-files-found: ignore
