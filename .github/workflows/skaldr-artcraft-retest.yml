# Revalidate existing ISO and current QEMU assertions without rebuilding Calamares.
name: ArtCraft GUI retest on existing Skaldr ISO
on:
  push:
    branches: [master]
    paths: ['.github/workflows/skaldr-artcraft-retest.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  artcraft-grub:
    if: github.repository == 'pomercier/Skaldr-OS'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Checkout latest ArtCraft and installer assertions
        uses: actions/checkout@v6
      - name: Install QEMU and OCR dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pacman -Syu --noconfirm git ffmpeg imagemagick tesseract-data-eng qemu-desktop socat btrfs-progs util-linux qemu-img curl python; then exit 0; fi
            test "$attempt" -lt 3 || exit 1
            sleep "$((attempt * 10))"
          done
      - name: Check original run and ISO source provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/44132973459" >/tmp/run.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/run.json'))
          assert r['head_sha']=='a4bb1da1b2460cf5192099e8194b61310a4539fc'
          assert r['status']=='completed'
          print('PASS: pinned already-built ISO; no recompilation')
          PY
      - name: Download previously built exact-source ISO
        uses: actions/download-artifact@v4
        with:
          name: skaldr-os-x86_64-261117
          repository: pomercier/Skaldr-OS
          run-id: 44132973459
          github-token: ${{ github.token }}
          path: machines/cachyos-dailylive
      - name: Check full ISO SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test "$(find machines/cachyos-dailylive -maxdepth 1 -name '*.iso' | wc -l)" -eq 1
          (cd machines/cachyos-dailylive && sha256sum -c SHA256SUMS)
      - name: Build Quickemu harness only
        shell: bash
        run: |
          set -euo pipefail
          useradd builder -m
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chmod -R a+rw .
          sudo -u builder git clone https://aur.archlinux.org/quickemu.git
          cd quickemu
          sudo -H -E -u builder makepkg --syncdeps --noconfirm
          pacman -U --noconfirm quickemu*.pkg.tar.zst
      - name: Checkout upstream Quicktest
        uses: actions/checkout@v6
        with:
          repository: quickemu-project/quicktest
          path: quicktest
      - name: Install GRUB/ext4 guest and verify native ArtCraft GUI
        shell: bash
        env:
          QT_NOTIFY: 'false'
          QT_OPEN_RESULTS: 'false'
          QT_QUICKGET_SKIP: 'true'
          QT_TESTCASES_DIR: './testcases'
          QUICKEMU_DISPLAY: 'none'
          QUICKEMU_VM_DIR: './machines'
          TEST_BOOTLOADER: 'grub'
          TEST_FILESYSTEM: 'ext4'
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP:-/tmp}/skaldr-installer-serial.log"
          : > "$log_file"
          (socket="machines/cachyos-dailylive/cachyos-dailylive-serial.socket"; while [ ! -S "$socket" ]; do sleep 1; done; socat -u "UNIX-CONNECT:$socket" STDOUT >> "$log_file") &
          serial_pid=$!
          trap 'kill "$serial_pid" 2>/dev/null || :; mkdir -p results/ci; cp "$log_file" results/ci/installer-serial.log || :' EXIT
          ./quicktest/quicktest test_install_calamares cachyos dailylive
          grep -Fq "Skaldr target packages and system preferences installed" "$log_file"
          grep -Fq "Skaldr login wallpaper configured." "$log_file"
          echo 'PASS: installed KDE/GRUB and checksum-verified ArtCraft GUI'
      - name: Index QEMU recordings
        if: always()
        run: python3 scripts/skaldr-visual-evidence.py --results-dir results --output results/ci/visual-evidence.json --frames-per-video 3
      - name: Upload evidence without another ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skaldr-existing-iso-artcraft-grub-ext4
          path: results/*
          if-no-files-found: warn
