name: Skaldr source checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser for isolated Calamares tests
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate Python entrypoints
        run: python -m py_compile archiso/airootfs/usr/local/bin/skaldr-profile archiso/airootfs/usr/local/bin/skaldr-postinstall archiso/airootfs/usr/local/bin/skaldr-cal-inject archiso/airootfs/usr/local/bin/skaldr-doctor scripts/skaldr-version.py scripts/skaldr-qmp-click.py archiso/airootfs/usr/local/bin/skaldr-welcome archiso/airootfs/usr/local/bin/skaldr-version
      - name: Validate Bash entrypoints
        run: |
          set -euo pipefail
          for script in archiso/airootfs/usr/local/bin/skaldr-gpu-assistant \
                        archiso/airootfs/usr/local/bin/skaldr-artcraft \
                        archiso/airootfs/usr/local/bin/skaldr-numlock \
                        archiso/airootfs/usr/local/bin/skaldr-center \
                        archiso/airootfs/usr/local/bin/removeun \
                        archiso/airootfs/usr/local/bin/calamares-online.sh \
                        scripts/skaldr-make-wallpaper.sh \
                        archiso/airootfs/usr/local/bin/skaldr-theme \
                        util-iso.sh \
                        buildiso.sh; do
            bash -n "$script"
          done
      - name: Run Skaldr integration checks
        run: python -m unittest discover -s tests -p 'test_skaldr.py' -v
