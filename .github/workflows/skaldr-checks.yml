name: Skaldr source checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser for isolated Calamares tests
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate Python entrypoints
        run: python -m py_compile archiso/airootfs/usr/local/bin/skaldr-profile archiso/airootfs/usr/local/bin/skaldr-postinstall archiso/airootfs/usr/local/bin/skaldr-cal-inject
      - name: Validate Bash entrypoints
        run: bash -n archiso/airootfs/usr/local/bin/skaldr-gpu-assistant archiso/airootfs/usr/local/bin/skaldr-artcraft archiso/airootfs/usr/local/bin/skaldr-capslock archiso/airootfs/usr/local/bin/calamares-online.sh
      - name: Run Skaldr integration checks
        run: python -m unittest discover -s tests -p 'test_skaldr.py' -v
