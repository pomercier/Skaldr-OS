# One-shot release gate for the first virtual-machine install fix.
name: Request proven Skaldr VM-fix preview.4
on:
  workflow_run:
    workflows: ["Desktop ISO"]
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: skaldr-vm-preview4-dispatch
  cancel-in-progress: false
jobs:
  request:
    if: >-
      github.repository == 'pomercier/Skaldr-OS' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_sha == '048fc90039838cc9889fefbbfd1b33984439e5fa' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: pomercier/Skaldr-OS
      SOURCE_SHA: 048fc90039838cc9889fefbbfd1b33984439e5fa
      RELEASE_TAG: v0.1.0-preview.4
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Require all five VM and ISO checks from exact source
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$RUN_ID" > /tmp/iso.json
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > /tmp/jobs.json
          python3 - <<'PY'
          import json, os
          run=json.load(open('/tmp/iso.json'))
          jobs=json.load(open('/tmp/jobs.json'))['jobs']
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']==os.environ['SOURCE_SHA']
          expected={'Build', 'Testing (grub / ext4)', 'Testing (limine / btrfs)',
                    'Testing (bios / live)', 'Verify full-size ISO preview reconstruction'}
          assert expected <= {j['name'] for j in jobs if j['conclusion']=='success'}
          assert all(j['conclusion']=='success' for j in jobs)
          print('PASS: all five real ISO, installation and cold-boot jobs')
          PY
          source_run="$(gh run list --repo "$REPO" --workflow skaldr-checks.yml \
            --commit "$SOURCE_SHA" --status success --json databaseId \
            --jq '.[0].databaseId // empty')"
          [[ -n "$source_run" ]] || {
            echo "::error::Exact-source checks missing; preview not authorized."
            exit 1
          }
          echo "PASS: exact-source checks run $source_run"
      - name: Verify actual VM serial logs prove chwd was bypassed and installed KDE cold-booted
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/skaldr-vm-grub" "$RUNNER_TEMP/skaldr-vm-limine"
          gh run download "$RUN_ID" --repo "$REPO" \
            --pattern 'skaldr-os-test-results-*-grub-ext4' \
            --dir "$RUNNER_TEMP/skaldr-vm-grub"
          gh run download "$RUN_ID" --repo "$REPO" \
            --pattern 'skaldr-os-test-results-*-limine-btrfs' \
            --dir "$RUNNER_TEMP/skaldr-vm-limine"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          for name in ('grub', 'limine'):
              folder=root / ('skaldr-vm-' + name)
              serials=list(folder.rglob('installer-serial.log'))
              quicklogs=list(folder.rglob('quicktest.log'))
              assert len(serials)==1, (name, 'Missing real Calamares serial evidence')
              assert len(quicklogs)==1, (name, 'Missing real installed-VM quicktest log')
              serial=serials[0].read_text(errors='replace')
              quick=quicklogs[0].read_text(errors='replace')
              assert 'Starting job "chwd"' not in serial, (name, 'VM bypass was not exercised')
              assert 'Skaldr target packages and system preferences installed' in serial
              assert 'Skaldr login wallpaper configured.' in serial
              assert 'Cold boot the newly installed system, without the live ISO' in quick
              assert 'Launch installed Skaldr Control Center in KDE Plasma' in quick
              print('PASS:',name,'virtual chwd bypass, package installation, cold boot, KDE GUI')
          PY
      - name: Request public preview from already-tested ISO, never rebuild it
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::Preview already exists; skip duplicate."
            exit 0
          fi
          gh workflow run skaldr-release.yml \
            --repo "$REPO" --ref master \
            --field version="$RELEASE_TAG" \
            --field stable=false \
            --field source_sha="$SOURCE_SHA"
          echo "Publication requested; the release workflow independently validates ISO artifacts."
