name: Desktop ISO
on:
  workflow_call:
    inputs:
      release_mode:
        description: 'Qualify a release-mode ISO without publishing a stable release'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Qualify a release-mode ISO without publishing a stable release'
        type: boolean
        required: false
        default: false
  push:
    branches: [master]
    # Rebuild the multi-GB ISO ONLY when its sources, branding, build tools
    # or embedded boot/install behavior change. Documentation and isolated
    # recovery tests have their own fast workflows. For a test-only change,
    # use workflow_dispatch to explicitly request another full ISO matrix.
    paths:
      - 'VERSION'
      - '.github/workflows/build.yml'
      - '.github/workflows/skaldr-release-candidate.yml'
      # Publication gate changes must rebuild and revalidate the exact source revision.
      - '.github/workflows/skaldr-auto-verified-preview.yml'
      - 'assets/**'
      - 'archiso/**'
      - 'buildiso.sh'
      - 'ci.build.sh'
      - 'util*.sh'
      - 'scripts/skaldr-build-calamares.sh'
      - 'scripts/skaldr-stage-calamares-repo.py'
      - 'scripts/skaldr-stage-artcraft.sh'
      - 'scripts/skaldr-make-wallpaper.sh'
      - 'scripts/skaldr-make-boot-splash.py'
      - 'scripts/skaldr-version.py'
      - 'scripts/skaldr-iso-audit.py'
      - 'scripts/skaldr-release-assets.py'
      - 'scripts/skaldr-visual-evidence.py'
      - 'scripts/skaldr-qmp-click.py'
      - 'scripts/skaldr-ci-installed-rollback.sh'
      - 'scripts/skaldr-find-btrfs-partition.py'
      - 'testcases/cachyos/dailylive/test_install_calamares'
      - 'testcases/cachyos/dailylive/test_live_bios'
      - 'tests/test_bios_installed_matrix.py'
      - 'tests/test_additional_bootloaders.py'
      - 'tests/test_calamares_installed_rollback.py'
      # Changes to the Limine installation regression suite must be validated in a VM.
      - 'tests/test_limine_branding.py'
      - 'tests/test_release_assets.py'
  pull_request:

concurrency:
  group: desktop-iso-${{ inputs.release_mode && 'release-candidate' || 'development' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    name: Build
    outputs:
      builddate: ${{ steps.date.outputs.builddate }}
    steps:
      - name: Get build date
        id: date
        run: |
          echo "builddate=$(date +'%y%m%d')" >> $GITHUB_OUTPUT

      - name: Install Git before checkout
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git

      - name: Checkout complete Skaldr OS repository history
        id: clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add CachyOS keyring
        id: keyring
        run: |
          pacman-key --init
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47

          sed -i '/^\[core\]$/i[cachyos]\nServer = https://mirror.cachyos.org/repo/$arch/$repo\n' /etc/pacman.conf

      - name: Install dependencies
        id: dependencies
        run: |
          sudo pacman -Syu --noconfirm git curl pacman-contrib archiso cachyos-keyring mkinitcpio-archiso squashfs-tools grub

      - name: Smoke-test native Qt6 Control Center offscreen
        shell: bash
        run: |
          set -euo pipefail
          pacman -S --noconfirm --needed pyside6
          QT_QPA_PLATFORM=offscreen python3 archiso/airootfs/usr/local/bin/skaldr-control-center --smoke-test

      - name: Verify source provenance and build version
        shell: bash
        run: |
          set -euo pipefail
          git --version
          git -c "safe.directory=$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree | grep -qx true
          git -c "safe.directory=$GITHUB_WORKSPACE" cat-file -e 3215497d2e8c5fea90e185affcf973dfa2cf790b^{commit}
          python3 scripts/skaldr-version.py --json
          test "$(python3 scripts/skaldr-version.py --field project_commit_count)" -gt 0

      - name: Run Skaldr source regressions before expensive ISO compilation
        shell: bash
        run: |
          set -euo pipefail
          pacman -S --noconfirm --needed python python-yaml
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Create build user
        id: user-archiso
        run: |
          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chmod -R a+rw .

      - name: Rebuild Calamares against current Boost libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo -H -E -u builder bash scripts/skaldr-build-calamares.sh

      - name: Build ISO (${{ steps.date.outputs.builddate }})
        id: build
        run: |
          if [[ "${{ inputs.release_mode }}" == "true" ]]; then
            version="$(tr -d '\r\n' < VERSION)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::Invalid release-mode version"; exit 1;
            }
            echo "Building a TEST-ONLY release-mode ISO; stable publication is NOT authorized."
            sudo -H -E -u builder env SKALDR_CALAMARES_REPO="$GITHUB_WORKSPACE/.skaldr-local" SKALDR_RELEASE_VERSION="$version" ./buildiso.sh
          else
            sudo -H -E -u builder env SKALDR_CALAMARES_REPO="$GITHUB_WORKSPACE/.skaldr-local" ./buildiso.sh
          fi

      - name: Verify test-only release-mode ISO identity
        if: ${{ inputs.release_mode == true }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          test -s "out/desktop/skaldr-${version}-x86_64.iso"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          expected_iso = Path("out/desktop") / f"skaldr-{version}-x86_64.iso"
          metadata_path = Path("build/archiso/airootfs/usr/share/skaldr/build.json")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          assert expected_iso.is_file() and expected_iso.stat().st_size > 0
          assert metadata["development"] is False, "A release-mode image must not carry a dev marker"
          assert metadata["version"] == metadata["iso_version"] == version
          assert metadata["git_revision"] == os.environ["GITHUB_SHA"]
          print("Release-mode identity, source revision and ISO name verified.")
          PY

      - name: Generate SHA256 checksums and source provenance
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find out/desktop -maxdepth 1 -name '*.iso' -print -quit)"
          test -s .skaldr-local/calamares-source.sha
          cp .skaldr-local/calamares-source.sha out/desktop/calamares-source.sha
          (cd out/desktop && sha256sum -- *.iso > SHA256SUMS)
          echo "Calamares source commit: $(cat out/desktop/calamares-source.sha)"

      - name: Audit measured ISO size and package categories
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/skaldr-iso-audit.py \
            --manifest archiso/packages_desktop.x86_64 \
            --iso-dir out/desktop \
            --output out/desktop/iso-audit.json

      - name: Upload ISO to artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: skaldr-os-${{ inputs.release_mode && 'release-candidate' || 'x86_64' }}-${{ steps.date.outputs.builddate }}
          path: out/desktop/*
          # The ISO is already SquashFS-compressed. Avoid expensive ZIP
          # recompression of a multi-gigabyte build on every CI run.
          compression-level: 0
          # An absent output must fail the build instead of leaving a green
          # job with no ISO for the independent QEMU installation matrix.
          if-no-files-found: error
  quicktest:
    name: Testing (${{ matrix.bootloader }} / ${{ matrix.filesystem }})
    runs-on: ubuntu-latest
    needs: build
    container:
      image: archlinux:base-devel
      options: --privileged
    strategy:
      fail-fast: false
      max-parallel: 4
      # Begin with representative installation smoke tests. Expand to the full
      # bootloader/filesystem matrix after these prove that the live desktop
      # can reach Calamares. This remains a real installer test, not a mock.
      matrix:
        include:
          - bootloader: grub
            filesystem: ext4
            firmware: uefi
          - bootloader: limine
            filesystem: btrfs
            firmware: uefi
          # Additional UEFI choices: require real installation and cold boot.
          - bootloader: refind
            filesystem: ext4
            firmware: uefi
          - bootloader: systemd-boot
            filesystem: ext4
            firmware: uefi
          - bootloader: bios
            filesystem: live
            firmware: bios
          # An actual legacy BIOS installation, not just a Syslinux live boot.
          - bootloader: grub-bios
            filesystem: ext4
            firmware: bios
    steps:
      - name: Clone CachyOS-Live-ISO
        id: clone
        uses: actions/checkout@v6

      - name: Install dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          # A single Arch mirror/signature CDN outage must not invalidate
          # the already-built ISO or hide a genuine package error.
          for attempt in 1 2 3; do
            if pacman -Syu --noconfirm git ffmpeg imagemagick tesseract-data-eng qemu-desktop socat btrfs-progs util-linux qemu-img; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Arch package installation failed after three attempts."
              exit 1
            fi
            echo "::warning::Arch mirror download failed (attempt $attempt/3), retrying."
            sleep $((attempt * 10))
          done

      - name: Create build user
        id: user
        run: |
          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chmod -R a+rw .

      - name: Build quickemu
        id: quickemu
        run: |
          sudo -u builder git clone https://aur.archlinux.org/quickemu.git
          cd quickemu
          sudo -H -E -u builder makepkg --syncdeps --noconfirm
          pacman -U --noconfirm quickemu*.pkg.tar.zst
          cd ..

      - name: Clone quicktest
        id: clone-quicktest
        uses: actions/checkout@v6
        with:
          repository: 'quickemu-project/quicktest'
          path: 'quicktest'

      - name: Download ISO
        id: download
        uses: actions/download-artifact@v4
        with:
          path: machines/cachyos-dailylive
          merge-multiple: true

      - name: Run quicktest
        id: quicktest
        run: |
          set -eu
          log_file="${RUNNER_TEMP:-/tmp}/skaldr-installer-serial.log"
          : > "$log_file"
          (
            socket="machines/cachyos-dailylive/cachyos-dailylive-serial.socket"
            while [ ! -S "$socket" ]; do sleep 1; done
            socat -u "UNIX-CONNECT:$socket" STDOUT >> "$log_file"
          ) &
          serial_pid=$!
          trap 'kill "$serial_pid" 2>/dev/null || :; mkdir -p results/ci; cp "$log_file" results/ci/installer-serial.log || :' EXIT
          if [ "${{ matrix.firmware }}" = "bios" ]; then
            # Legacy firmware is required by both the live smoke test and
            # the new real GRUB/ext4 BIOS installation test.
            printf '\nboot="legacy"\n' >> machines/cachyos-dailylive.conf
          fi
          if [ "${{ matrix.bootloader }}" = "bios" ]; then
            ./quicktest/quicktest test_live_bios cachyos dailylive
          else
            ./quicktest/quicktest test_install_calamares cachyos dailylive
            # The GUI alone is not proof that target packages and policies
            # were installed; preserve the mandatory serial assertions.
            grep -Fq "Skaldr target packages and system preferences installed" "$log_file"
            grep -Fq "Skaldr login wallpaper configured." "$log_file"
            if [ "${{ matrix.filesystem }}" = "btrfs" ]; then
              grep -Fq "Skaldr: Btrfs snapshot configuration is available." "$log_file"
            fi
            if [ "${{ matrix.bootloader }}" = "limine" ]; then
              # The installed Btrfs VM must have a verified Skaldr boot group,
              # not merely a working old CachyOS fallback.
              # If the refreshed Skaldr image differs from its rooted legacy
              # fallback, retain the existing bootable candidate rather than
              # aborting Calamares after disk partitioning. The cold-boot and
              # Btrfs rollback tests below still must succeed.
              grep -Eq 'Skaldr: Limine menu reconciliation: (legacy-duplicate-removed|already-skaldr|legacy-preserved-rootless|legacy-preserved-verified-skaldr)' "$log_file"
              if grep -Fq 'Skaldr: Limine menu reconciliation: legacy-preserved-rootless' "$log_file"; then
                grep -Fq 'Skaldr: preserving rooted legacy Limine fallback' "$log_file"
              fi
              if grep -Fq 'Skaldr: Limine menu reconciliation: legacy-preserved-verified-skaldr' "$log_file"; then
                # This status must reflect an actual fstab root repair, not
                # merely an entry label change.
                grep -Fq 'Skaldr: reconstructed root arguments from installed Btrfs fstab' "$log_file"
              fi
            fi
          fi
        env:
          QT_NOTIFY: "false"
          QT_OPEN_RESULTS: "false"
          QT_QUICKGET_SKIP: "true"
          QT_TESTCASES_DIR: "./testcases"
          QUICKEMU_DISPLAY: "none"
          QUICKEMU_VM_DIR: "./machines"
          TEST_BOOTLOADER: "${{ matrix.bootloader == 'grub-bios' && 'grub' || matrix.bootloader }}"
          TEST_FILESYSTEM: "${{ matrix.filesystem }}"
          TEST_FIRMWARE: "${{ matrix.firmware }}"

      - name: Index Quicktest recordings and sample visual frames
        if: always()
        shell: bash
        run: |
          python3 scripts/skaldr-visual-evidence.py \
            --results-dir results \
            --output results/ci/visual-evidence.json \
            --frames-per-video 3

      - name: Upload results to artifacts
        id: upload-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skaldr-os-test-results-${{needs.build.outputs.builddate}}-${{ matrix.bootloader }}-${{ matrix.filesystem }}
          path: results/*

  preview_assets:
    name: Verify full-size ISO preview reconstruction
    runs-on: ubuntu-latest
    needs: [build, quicktest]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout validated Skaldr sources
        uses: actions/checkout@v4

      - name: Download this run's exact ISO and original checksum
        uses: actions/download-artifact@v4
        with:
          name: skaldr-os-${{ inputs.release_mode && 'release-candidate' || 'x86_64' }}-${{ needs.build.outputs.builddate }}
          path: ci-artifacts

      - name: Verify, split, and reconstruct the actual multi-gigabyte ISO
        shell: bash
        run: |
          set -euo pipefail
          test "$(find ci-artifacts -maxdepth 1 -type f -name '*.iso' | wc -l)" -eq 1
          (cd ci-artifacts && sha256sum --check SHA256SUMS)
          iso="$(find ci-artifacts -maxdepth 1 -type f -name '*.iso' -print -quit)"
          python3 scripts/skaldr-release-assets.py prepare \
            --iso "$iso" \
            --checksum ci-artifacts/SHA256SUMS \
            --out release-assets
          # Remove the redundant source ISO before reconstructing to keep
          # peak GitHub runner disk use lower than 9 GB.
          rm -f -- "$iso"
          python3 scripts/skaldr-release-assets.py reassemble --directory release-assets
          (cd release-assets && sha256sum --check SHA256SUMS)
          echo "Verified all parts and reassembled the original multi-gigabyte ISO."
          du -h release-assets/*

      - name: Store proof and reassembly instructions (no duplicate ISO)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skaldr-preview-verification-${{ needs.build.outputs.builddate }}
          path: |
            release-assets/SHA256SUMS
            release-assets/SHA256SUMS.parts
            release-assets/ASSEMBLE.txt
            release-assets/reassemble-skaldr-iso.py
          if-no-files-found: warn
