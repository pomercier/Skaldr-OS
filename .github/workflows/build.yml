name: Desktop ISO
on:
  workflow_dispatch:
  push:
    branches:
    - master
  pull_request:

concurrency:
  group: desktop-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    name: Build
    outputs:
      builddate: ${{ steps.date.outputs.builddate }}
    steps:
      - name: Get build date
        id: date
        run: |
          echo "builddate=$(date +'%y%m%d')" >> $GITHUB_OUTPUT

      - name: Install Git before checkout
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git

      - name: Checkout complete Skaldr OS repository history
        id: clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add CachyOS keyring
        id: keyring
        run: |
          pacman-key --init
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47

          sed -i '/^\[core\]$/i[cachyos]\nServer = https://mirror.cachyos.org/repo/$arch/$repo\n' /etc/pacman.conf

      - name: Install dependencies
        id: dependencies
        run: |
          sudo pacman -Syu --noconfirm git curl pacman-contrib archiso cachyos-keyring mkinitcpio-archiso squashfs-tools grub

      - name: Verify source provenance and build version
        shell: bash
        run: |
          set -euo pipefail
          git --version
          git -c "safe.directory=$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree | grep -qx true
          git -c "safe.directory=$GITHUB_WORKSPACE" cat-file -e 3215497d2e8c5fea90e185affcf973dfa2cf790b^{commit}
          python3 scripts/skaldr-version.py --json
          test "$(python3 scripts/skaldr-version.py --field project_commit_count)" -gt 0

      - name: Create build user
        id: user-archiso
        run: |
          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chmod -R a+rw .

      - name: Rebuild Calamares against current Boost libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo -H -E -u builder bash scripts/skaldr-build-calamares.sh

      - name: Build ISO (${{ steps.date.outputs.builddate }})
        id: build
        run: |
          sudo -H -E -u builder env SKALDR_CALAMARES_REPO="$GITHUB_WORKSPACE/.skaldr-local" ./buildiso.sh

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find out/desktop -maxdepth 1 -name '*.iso' -print -quit)"
          (cd out/desktop && sha256sum -- *.iso > SHA256SUMS)

      - name: Audit measured ISO size and package categories
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/skaldr-iso-audit.py \
            --manifest archiso/packages_desktop.x86_64 \
            --iso-dir out/desktop \
            --output out/desktop/iso-audit.json

      - name: Upload ISO to artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: skaldr-os-x86_64-${{ steps.date.outputs.builddate }}
          path: out/desktop/*
  quicktest:
    name: Testing (${{ matrix.bootloader }} / ${{ matrix.filesystem }})
    runs-on: ubuntu-latest
    needs: build
    container:
      image: archlinux:base-devel
      options: --privileged
    strategy:
      fail-fast: false
      max-parallel: 4
      # Begin with representative installation smoke tests. Expand to the full
      # bootloader/filesystem matrix after these prove that the live desktop
      # can reach Calamares. This remains a real installer test, not a mock.
      matrix:
        include:
          - bootloader: grub
            filesystem: ext4
          - bootloader: limine
            filesystem: btrfs
          - bootloader: bios
            filesystem: live
    steps:
      - name: Clone CachyOS-Live-ISO
        id: clone
        uses: actions/checkout@v6

      - name: Install dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          # A single Arch mirror/signature CDN outage must not invalidate
          # the already-built ISO or hide a genuine package error.
          for attempt in 1 2 3; do
            if pacman -Syu --noconfirm git ffmpeg imagemagick tesseract-data-eng qemu-desktop socat; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Arch package installation failed after three attempts."
              exit 1
            fi
            echo "::warning::Arch mirror download failed (attempt $attempt/3), retrying."
            sleep $((attempt * 10))
          done

      - name: Create build user
        id: user
        run: |
          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chmod -R a+rw .

      - name: Build quickemu
        id: quickemu
        run: |
          sudo -u builder git clone https://aur.archlinux.org/quickemu.git
          cd quickemu
          sudo -H -E -u builder makepkg --syncdeps --noconfirm
          pacman -U --noconfirm quickemu*.pkg.tar.zst
          cd ..

      - name: Clone quicktest
        id: clone-quicktest
        uses: actions/checkout@v6
        with:
          repository: 'quickemu-project/quicktest'
          path: 'quicktest'

      - name: Download ISO
        id: download
        uses: actions/download-artifact@v4
        with:
          path: machines/cachyos-dailylive
          merge-multiple: true

      - name: Run quicktest
        id: quicktest
        run: |
          set -eu
          log_file="${RUNNER_TEMP:-/tmp}/skaldr-installer-serial.log"
          : > "$log_file"
          (
            socket="machines/cachyos-dailylive/cachyos-dailylive-serial.socket"
            while [ ! -S "$socket" ]; do sleep 1; done
            socat -u "UNIX-CONNECT:$socket" STDOUT >> "$log_file"
          ) &
          serial_pid=$!
          trap 'kill "$serial_pid" 2>/dev/null || :; mkdir -p results/ci; cp "$log_file" results/ci/installer-serial.log || :' EXIT
          if [ "${{ matrix.bootloader }}" = "bios" ]; then
            # Quickemu defaults to UEFI. Override only this matrix job;
            # GRUB/ext4 and Limine/Btrfs installation checks remain UEFI.
            printf '\nboot="legacy"\n' >> machines/cachyos-dailylive.conf
            ./quicktest/quicktest test_live_bios cachyos dailylive
          else
            ./quicktest/quicktest test_install_calamares cachyos dailylive
            # The GUI alone is not proof that target packages and policies
            # were installed; preserve the mandatory serial assertions.
            grep -Fq "Skaldr target packages and system preferences installed" "$log_file"
            if [ "${{ matrix.filesystem }}" = "btrfs" ]; then
              grep -Fq "Skaldr: Btrfs snapshot configuration is available." "$log_file"
            fi
          fi
        env:
          QT_NOTIFY: "false"
          QT_OPEN_RESULTS: "false"
          QT_QUICKGET_SKIP: "true"
          QT_TESTCASES_DIR: "./testcases"
          QUICKEMU_DISPLAY: "none"
          QUICKEMU_VM_DIR: "./machines"
          TEST_BOOTLOADER: "${{ matrix.bootloader }}"
          TEST_FILESYSTEM: "${{ matrix.filesystem }}"

      - name: Index Quicktest recordings and sample visual frames
        if: always()
        shell: bash
        run: |
          python3 scripts/skaldr-visual-evidence.py \
            --results-dir results \
            --output results/ci/visual-evidence.json \
            --frames-per-video 3

      - name: Upload results to artifacts
        id: upload-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skaldr-os-test-results-${{needs.build.outputs.builddate}}-${{ matrix.bootloader }}-${{ matrix.filesystem }}
          path: results/*

  preview_assets:
    name: Verify full-size ISO preview reconstruction
    runs-on: ubuntu-latest
    needs: [build, quicktest]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout validated Skaldr sources
        uses: actions/checkout@v4

      - name: Download this run's exact ISO and original checksum
        uses: actions/download-artifact@v4
        with:
          name: skaldr-os-x86_64-${{ needs.build.outputs.builddate }}
          path: ci-artifacts

      - name: Verify, split, and reconstruct the actual multi-gigabyte ISO
        shell: bash
        run: |
          set -euo pipefail
          test "$(find ci-artifacts -maxdepth 1 -type f -name '*.iso' | wc -l)" -eq 1
          (cd ci-artifacts && sha256sum --check SHA256SUMS)
          iso="$(find ci-artifacts -maxdepth 1 -type f -name '*.iso' -print -quit)"
          python3 scripts/skaldr-release-assets.py prepare \
            --iso "$iso" \
            --checksum ci-artifacts/SHA256SUMS \
            --out release-assets
          # Remove the redundant source ISO before reconstructing to keep
          # peak GitHub runner disk use lower than 9 GB.
          rm -f -- "$iso"
          python3 scripts/skaldr-release-assets.py reassemble --directory release-assets
          (cd release-assets && sha256sum --check SHA256SUMS)
          echo "Verified all parts and reassembled the original multi-gigabyte ISO."
          du -h release-assets/*

      - name: Store proof and reassembly instructions (no duplicate ISO)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skaldr-preview-verification-${{ needs.build.outputs.builddate }}
          path: |
            release-assets/SHA256SUMS
            release-assets/SHA256SUMS.parts
            release-assets/ASSEMBLE.txt
            release-assets/reassemble-skaldr-iso.py
          if-no-files-found: warn
