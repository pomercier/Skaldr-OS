guest_os="linux"
disk_img="cachyos-dailylive/disk.qcow2"
# The default Quickemu 16G disk leaves ~12G for a Limine/Btrfs root.
# Validate installation on a realistic sparse virtual disk instead.
disk_size="48G"
# Quickemu ignores cpu_model in the VM config. QEMU itself also does not
# recognize "x86-64-v3" as a CPU model name. Haswell-v4 is a supported,
# long-term-stable QEMU CPU model satisfying the x86-64-v3 ABI (QEMU docs).
# Pass it through extra_args and assert the last effective -cpu argument.
serial="socket"
iso="$(realpath "$(find -name "*.iso" | head -n1)")"

# HMP mouse_move sends relative mouse events. Switch from Quickemu's
# default absolute USB tablet to a relative USB mouse for this CI test.
mouse="tablet"
# Unique CI SMBIOS marker; ordinary VMs and physical installs stay unmodified.
extra_args="-cpu Haswell-v4 -qmp unix:$(pwd)/cachyos-dailylive/skaldr-ci-qmp.sock,server=on,wait=off -smbios type=1,product=Skaldr-CI"
