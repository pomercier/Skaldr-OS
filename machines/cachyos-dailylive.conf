guest_os="linux"
disk_img="cachyos-dailylive/disk.qcow2"
# The default Quickemu 16G disk leaves ~12G for a Limine/Btrfs root.
# Validate installation on a realistic sparse virtual disk instead.
disk_size="48G"
# Quickemu 4.9.9 ignores cpu_model in VM configuration files.
# Pass -cpu in extra_args (last option wins in QEMU), and verify the
# actual command line at runtime so CI cannot silently use host passthrough.
serial="socket"
iso="$(realpath "$(find -name "*.iso" | head -n1)")"

# HMP mouse_move sends relative mouse events. Switch from Quickemu's
# default absolute USB tablet to a relative USB mouse for this CI test.
mouse="tablet"
# Unique CI SMBIOS marker; ordinary VMs and physical installs stay unmodified.
extra_args="-cpu x86-64-v3 -qmp unix:$(pwd)/cachyos-dailylive/skaldr-ci-qmp.sock,server=on,wait=off -smbios type=1,product=Skaldr-CI"
