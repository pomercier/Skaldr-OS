guest_os="linux"
disk_img="cachyos-dailylive/disk.qcow2"
iso="$(realpath "$(find -name "*.iso" | head -n1)")"

# HMP mouse_move sends relative mouse events. Switch from Quickemu's
# default absolute USB tablet to a relative USB mouse for this CI test.
mouse="tablet"
extra_args="-qmp unix:$(pwd)/cachyos-dailylive/skaldr-ci-qmp.sock,server=on,wait=off"
