<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <title>Skaldr OS — systemd-boot illustrated bootloader selection</title>
  <desc>An illustrative Skaldr-branded visualization of systemd-boot; not a screenshot of a running bootloader.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071023"/><stop offset=".65" stop-color="#101e39"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00deeb"/><stop offset=".53" stop-color="#4e81ef"/><stop offset="1" stop-color="#df41e6"/></linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <path d="M0 0H960" stroke="url(#glow)" stroke-width="8"/>
  <circle cx="745" cy="300" r="250" fill="none" stroke="#6178c8" opacity=".1" stroke-width="2"/>
  <circle cx="745" cy="300" r="205" fill="none" stroke="#40f0ff" opacity=".09" stroke-width="2"/>
  <text x="72" y="95" font-size="47" font-weight="800" fill="#e8f5ff" font-family="DejaVu Sans,sans-serif" letter-spacing="3">SKALDR OS</text>
  <text x="74" y="135" font-size="21" fill="#9ab6d8" font-family="DejaVu Sans,sans-serif">Minimal menu · lightweight UEFI boot manager</text>
  <rect x="72" y="162" width="816" height="270" rx="12" fill="#080f22" stroke="#55d1ff" stroke-opacity=".6" stroke-width="2"/>
  
  <text x="120" y="211" fill="#91bdcf" font-size="25" font-family="DejaVu Sans Mono,monospace">systemd-boot</text>
  <rect x="121" y="240" width="715" height="49" rx="4" fill="#194763"/>
  <text x="144" y="273" fill="#f5fbff" font-size="27" font-family="DejaVu Sans Mono,monospace">&gt; Skaldr OS</text>
  <text x="144" y="337" fill="#a6bbd2" font-size="25" font-family="DejaVu Sans Mono,monospace">  Skaldr OS (LTS)</text>
  <text x="144" y="397" fill="#8099b6" font-size="25" font-family="DejaVu Sans Mono,monospace">  Firmware setup</text>
  <path d="M72 470H888" stroke="url(#glow)" stroke-width="3" opacity=".6"/>
  <text x="75" y="509" font-size="20" fill="#a6bbd9" font-family="DejaVu Sans,sans-serif">Illustrative preview — appearance varies by firmware and configuration</text>
</svg>
